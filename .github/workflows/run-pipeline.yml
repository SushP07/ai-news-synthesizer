name: AI Research Digest Pipeline

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM UTC
  workflow_dispatch:     # Manual trigger button
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AI Digest Pipeline
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: python main.py

      - name: Commit Generated Digest
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          if [ -n "$(git status --porcelain digests/)" ]; then
            git add digests/
            git commit -m "chore: auto-generated daily AI research digest [skip ci]"
            git push
          else
            echo "No new digest generated today."

      - name: Upload Digest Artifact
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: daily-digest
          path: digests/
          retention-days: 30
